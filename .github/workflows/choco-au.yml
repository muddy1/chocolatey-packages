name: Run Chocolatey AUon:
  # Run on a schedule (e.g., every 6 hours)
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:jobs:
  update-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install Chocolatey AU Module
        shell: pwsh
        run: |
          Install-Module -Name chocolatey-au -Force -Scope CurrentUser
      - name: Run Package Updates
        shell: pwsh
        env:
        # automatically push packages to chocolatey.org
        CHOCOLATEY_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
        # Call master update script or updateall logic
          .\updateall.ps1
